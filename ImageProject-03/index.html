<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"> </script>
  </head>

  <body>
    <a-scene>
<!-- Assets -->
      <a-assets>
        <img id="bedroomSky" src="Assets/pine_attic.jpg">

        <a-asset-item
         id="sheep"
         src="Assets/sheep.gltf">
        </a-asset-item>

        <a-asset-item
        id="fence"
        src="Assets/fence.gltf">
        </a-asset-item>
      </a-assets>

<!-- Bedroom background -->
      <a-sky src="bedroomSky"> </a-sky>

      <!-- Floor -->
      <a-plane
        position="0 0 0"
        rotation="-90 0 0"
        width="18"
        height="18"
        color="#8b7968">
      </a-plane>
      
      <!-- Bed -->
      <a-box
        position="0 0.45 -2"
        width="3.2"
        height="0.35"
        depth="4.2"
        color="#5b3828">
      </a-box>

      <!-- Mattress -->
      <a-box
        position="0 0.78 -2"
        width="3"
        height="0.35"
        depth="4"
        color="#eee7df">
      </a-box>

      <!-- Headboard -->
      <a-box
        position="0 1.08 -4.02"
        width="3.25"
        height="2"
        depth="0.22"
        color="#65432f">
      </a-box>
    
      <!-- Pillow 1 -->
      <a-box
        position="-0.82 1.08 -3.45"
        width="1.05"
        height="0.18"
        depth="0.72"
        color="#ffffff">
      </a-box>

      <!-- Pillow 2 -->
      <a-box
        position="0.82 1.08 -3.45"
        width="1.05"
        height="0.18"
        depth="0.72"
        color="#ffffff">
      </a-box>

      <!-- Blanket -->
       <a-box
        position="0 1.02 -1.55"
        width="3"
        height="0.12"
        depth="3"
        color="#b9a8a0">
      </a-box>

      <!-- Wooden fence model -->
      <a-entity
        gltf-model="#fence"
        position="0 0.05 -6"
        rotation="0 0 0"
        scale="0.65 0.65 0.65">
      </a-entity>

      <!-- Sheep -->
<a-entity
  gltf-model="#sheep"
  position="-3 1.5 0"
  scale="1 1 1">
</a-entity>

<a-entity
  gltf-model="#sheep"
  position="-1 2 0"
  scale="1 1 1">
</a-entity>

<a-entity
  gltf-model="#sheep"
  position="1 2 0"
  scale="1 1 1">
</a-entity>

<a-entity
  gltf-model="#sheep"
  position="3 1.5 0"
  scale="1 1 1">
</a-entity>

    </a-scene>
  </body>
</html>
