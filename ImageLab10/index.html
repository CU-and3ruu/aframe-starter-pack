<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"> </script>
  </head>
  <body>
    <a-scene>

      <a-assets>
        <img id="summerSky" src="Assets/secluded_beach.jpg">
        <img id="sandTexture" src="Assets/sand.jpg">
        <img id="umbrellaTexture" src="Assets/umbrella.jpg">
      </a-assets>

      <a-box
        position="4 0.3 -2"
        width="2"
        height="1"
        depth="1.5"
        material="src: #sandTexture">
    </a-box>

    <a-cylinder
      position="4 1.2 -2"
      radius="0.3"
      height="1.2"
      material="src: #sandTexture">
    </a-cylinder>

    <a-cylinder
      position="2 1 -4"
      radius="0.05"
      height="2"
      color="#8B4513">
    </a-cylinder>
    
    <a-cone
      position="2 2 -4"
      radius-bottom="1"
      radius-top="0.05"
      height="0.7"
      material="src: #umbrellaTexture">
    </a-cone>

      <a-sky src="#summerSky"></a-sky>
    </a-scene>
  </body>
</html>
<!--
For Project 3, I plan to make a "World of my own Imagination"
in VR about a bedroom where sheep continuously jump over a bed,
representing the idea of counting sheep when trying to fall asleep.
-->
